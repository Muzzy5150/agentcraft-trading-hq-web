name: Build reporting kit (not a Minecraft HQ)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm test && npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: reporting-kit-review
          path: |
            release/*.zip
            release/*.sha256
